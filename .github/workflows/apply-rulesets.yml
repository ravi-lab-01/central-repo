name: Apply GitHub Rulesets

on:
  workflow_dispatch:

jobs:
  apply-rulesets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run PowerShell script
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: |
          ./scripts/Apply-Rulesets.ps1
